<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Downtown Honolulu Parking Map - Find Parking Rates & Locations</title>
    <meta name="description"
        content="Interactive map showing downtown Honolulu parking locations, rates, hours, and availability. Find the best parking spots in Honolulu's business district." />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅿️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=4" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="app.js?v=4"></script>
</head>

<body>
    <header class="app-header">
        <h1>Downtown Honolulu Parking</h1>
        <div class="filter-chips" role="toolbar" aria-label="Filters">
            <button class="chip" data-filter="price" data-value="3" aria-pressed="false">$3/hr or less</button>
            <button class="chip" data-filter="price" data-value="5" aria-pressed="false">$5/hr or less</button>
            <button class="chip" data-filter="monthly" data-value="yes" aria-pressed="false">Monthly</button>
            <button class="chip" data-filter="hours" data-value="24/7" aria-pressed="false">24/7</button>
            <button class="chip" data-filter="height" data-value="no-limit" aria-pressed="false">No height limit</button>
            <button class="chip" data-filter="type" data-value="garage" aria-pressed="false">Garages only</button>
            <button id="resetFilters" class="chip chip-reset" hidden>Clear</button>
        </div>
    </header>

    <main class="layout">
        <!-- Sidebar on desktop, bottom sheet on mobile -->
        <aside id="panel" class="panel" data-state="peek" aria-label="Parking spots">
            <div class="sheet-handle" id="sheetHandle">
                <span class="grabber" aria-hidden="true"></span>
                <span id="resultCount" class="result-count"></span>
                <span class="sort-note">Sorted by price</span>
            </div>
            <div class="panel-body">
                <div id="listView">
                    <ul id="listContainer" class="spot-list"></ul>
                    <p id="emptyState" class="empty-state" hidden>
                        No spots match these filters.
                        <button type="button" class="link-button" id="emptyReset">Clear filters</button>
                    </p>
                    <footer class="credits">
                        <span>© 2025 Jacob Graham · Rates subject to change</span>
                        <a href="https://github.com/jacobrg808" target="_blank" rel="noopener">GitHub</a>
                    </footer>
                </div>
                <div id="detailView" hidden></div>
            </div>
        </aside>

        <div id="map" aria-label="Parking map"></div>
    </main>
</body>

</html>
